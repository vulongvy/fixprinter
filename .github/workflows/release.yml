name: Release

# Push a tag like v13.5.0 -> builds the Inno installer on a Windows runner,
# creates the GitHub Release (or refreshes its asset if it already exists)
# and uploads the installer. If the WINGET_TOKEN secret exists (classic PAT,
# scope: repo), it also runs wingetcreate update --submit to open the
# version-update PR on winget-pkgs.
# NOTE: the very first winget submission must be done manually once
# (see HUONG_DAN_PHAT_HANH.md); wingetcreate update only works afterwards.
# NOTE: a run uses the workflow file from the tag's commit, so fixes here
# only take effect from the NEXT tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed: $LASTEXITCODE" }
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $found) { throw "ISCC.exe not found after install attempt" }
          Write-Host "ISCC: $found"
          "ISCC_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          & "$env:ISCC_PATH" "/DAppVersion=$ver" "FixPrinter.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Create or refresh GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $asset = "dist/FixPrinter-Setup-$ver.exe"
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:GITHUB_REF_NAME already exists - refreshing asset."
            gh release upload $env:GITHUB_REF_NAME $asset --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset --title "FixPrinter $env:GITHUB_REF_NAME" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release step failed: $LASTEXITCODE" }

      - name: Submit winget update (optional)
        shell: pwsh
        continue-on-error: true
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Host 'No WINGET_TOKEN secret - skipping winget submission.'
            exit 0
          }
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/FixPrinter-Setup-$ver.exe"
          Invoke-WebRequest 'https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe' -OutFile wingetcreate.exe
          .\wingetcreate.exe update vulongvy.FixPrinter --urls $url --version $ver --submit
